# Verifica o código e gera, a partir de src/:
# - wiki/ — os arquivos prontos para a wiki (sem comentários, com o cabeçalho
#   @target e as ligações entre arquivos);
# - dist/Ronda-console.js — o pacote único para colar no console;
# - wiki/Ronda-Changelog.wiki e wiki/Ronda-Documentacao.wiki — o histórico de
#   versões e a documentação, publicados em Usuário:Little Sunshine/Ronda/Changelog
#   e Usuário:Little Sunshine/Ronda.
# Em pull requests, só verifica e gera (os arquivos ficam na aba Actions).
# Os testes (npm test) rodam antes de gerar; se falharem, nada é gravado nem publicado.
# No main, grava wiki/ e dist/ no branch "gerados" (um único commit, refeito a cada
# construção; o main é protegido e só aceita pull requests) e, num trabalho separado
# no ambiente "wiki" (que pode exigir aprovação), publica na wiki as páginas que
# mudaram, com a senha de robô dos segredos WIKI_BOT_USER e WIKI_BOT_PASSWORD
# (sem eles, a publicação é pulada).
# Em tags v* (ex.: v1.0.0), anexa os arquivos à versão no GitHub.
name: Construir

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'ferramentas/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'docs/documentacao.wiki'
      - '.github/workflows/construir.yml'
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar na wiki'
        type: boolean
        default: true
      simular:
        description: 'Só simular (mostra o que mudaria, sem editar)'
        type: boolean
        default: false
      forcar_doc:
        description: 'Substituir a documentação e o histórico mesmo se editados na wiki'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: construir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar, testar e gerar
        run: npm run construir

      - name: Disponibilizar para download (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Ronda
          path: |
            wiki/
            dist/

      # Só no main: os arquivos gerados vão para o branch "gerados", fora do main
      # (protegido: só aceita pull requests). Um commit só, com a versão e o commit de origem.
      - name: Gravar wiki/ e dist/ no branch gerados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          versao=$(cat wiki/Ronda-Versao.wiki)
          mkdir -p /tmp/gerados && cp -r wiki dist /tmp/gerados/
          cd /tmp/gerados
          git init -q -b gerados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki dist
          git commit -q -m "Arquivos gerados do Ronda $versao (main ${GITHUB_SHA::7}) [skip ci]"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gerados

      - name: Compactar para a versão
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd wiki && zip -r ../Ronda-wiki.zip .

      - name: Anexar à versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Ronda-wiki.zip
            dist/Ronda-console.js
          generate_release_notes: true

  # Publicação num trabalho separado, no ambiente "wiki": com revisores obrigatórios
  # configurados em Settings › Environments › wiki, cada publicação espera aprovação.
  # Só roda se a construção (com os testes) passou.
  publicar:
    needs: construir
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publicar))
    runs-on: ubuntu-latest
    environment: wiki
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar os arquivos gerados
        uses: actions/download-artifact@v4
        with:
          name: Ronda

      - name: Publicar na wiki
        env:
          WIKI_BOT_USER: ${{ secrets.WIKI_BOT_USER }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.simular }}
          FORCE_DOC: ${{ github.event_name == 'workflow_dispatch' && inputs.forcar_doc }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          versao=$(cat wiki/Ronda-Versao.wiki)
          titulo=$(printf '%s' "$COMMIT_MSG" | head -n1 | cut -c1-150)
          export WIKI_SUMMARY="Atualização do Ronda $versao (GitHub ${GITHUB_SHA::7}${titulo:+: $titulo})"
          node ferramentas/publicar-wiki.js
